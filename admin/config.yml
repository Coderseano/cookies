backend:
  name: github
  repo: coderseano/cookies
  branch: main
  base_url: https://decap-cms-oauth-provider.vercel.app
  auth_endpoint: oauth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "cookie_spots"
    label: "Cookie Spots"
    files:
      - file: "spots.json"
        label: "All Cookie Spots"
        name: "spots"
        fields:
          - { label: "Cookie Spots Data", name: "spots", widget: "list", summary: "{{fields.name}} - {{fields.location}}" }
