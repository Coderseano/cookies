backend:
  name: github
  repo: Coderseano/cookies
  branch: main

media_folder: "images"

collections:
  - name: "spots"
    label: "Cookie Spots"
    folder: "."
    create: false
    delete: false
    files:
      - file: "spots.json"
        name: "spots"
        label: "All Cookie Spots Database"
        fields:
          - label: "Spots List"
            name: "spots"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Bakery Name", name: "name", widget: "string"}
              - {label: "Location Description", name: "location", widget: "string"}
              - {label: "Region", name: "region", widget: "select", options: ["Europe", "North America", "Latin America & Caribbean", "Ireland & UK"]}
              - {label: "Category", name: "category", widget: "select", options: ["approved", "friend", "featured"]}
              - {label: "Latitude", name: "lat", widget: "number", value_type: "float"}
              - {label: "Longitude", name: "lng", widget: "number", value_type: "float"}
              - {label: "Rating Text", name: "rating", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
              - {label: "Image URL", name: "img", widget: "string"}
