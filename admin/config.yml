backend:
  name: github
  repo: Coderseano/cookies # e.g. john-doe/cookies
  branch: main
  base_url: https://api.decapcms.org
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "cookie_spots"
    label: "Cookie Spots"
    files:
      - file: "spots.json"
        label: "All Cookie Spots"
        name: "spots"
        fields:
          - { label: "Cookie Spots Data", name: "spots", widget: "list", summary: "{{fields.name}} - {{fields.location}}" }
